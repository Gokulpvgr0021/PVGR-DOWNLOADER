
name: Build PVGR DOWNLOADER APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q "$(find . -maxdepth 1 -iname 'PVGR_DOWNLOADER_source*.zip' -print -quit)" -d extracted

      - name: Fix missing Android import
        run: |
          sed -i '/import android.graphics.Typeface;/a import android.graphics.drawable.GradientDrawable;' extracted/PVGR_DOWNLOADER/app/src/main/java/com/pvgr/downloader/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/PVGR_DOWNLOADER
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PVGR-DOWNLOADER-APK
          path: extracted/PVGR_DOWNLOADER/app/build/outputs/apk/debug/app-debug.apk
